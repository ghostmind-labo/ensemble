name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Scenes are TypeScript loaded by Node's native type stripping.
          node-version: "22.6"
      - run: npm ci
      - run: npm run typecheck
      # Every suite mocks OpenRouter, so CI needs no key and spends nothing.
      - run: npm test
      - run: npm run build
