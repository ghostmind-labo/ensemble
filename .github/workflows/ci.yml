name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor: runner files are .mts loaded by Node's UNFLAGGED
        # type stripping, which landed there (22.6 needs
        # --experimental-strip-types, so a runner will not load at all).
        # 24.x is what most people run.
        node: ["22.18", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first (pretest). Every suite stubs the decider or
      # mocks fetch, so CI needs no TYPESAFE_API_KEY and spends nothing.
      - run: npm test
